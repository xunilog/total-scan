name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0"
        required: true
        type: string
      description:
        description: "Release description / notes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            output: release/ScanCarburant.dmg
            asset: ScanCarburant-macos-arm64.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output: release/ScanCarburant.msi
            asset: ScanCarburant-windows-x64.msi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: deno install
      - name: Build
        run: deno desktop -A --target ${{ matrix.target }} --output ${{ matrix.output }} --exclude node_modules .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Create tag and release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          tag="v${VERSION#v}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "$DESCRIPTION" \
            --target develop \
            artifacts/*

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0"
        required: true
        type: string
      description:
        description: "Release description / notes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Set version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const v = process.env.RELEASE_VERSION;
          for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
            const j = JSON.parse(fs.readFileSync(f, "utf8"));
            j.version = v;
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
          }
          const cargoPath = "src-tauri/Cargo.toml";
          const cargo = fs
            .readFileSync(cargoPath, "utf8")
            .replace(/^version = ".*"$/m, `version = "${v}"`);
          fs.writeFileSync(cargoPath, cargo);
          EOF
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: release v${{ inputs.version }}"
            git push
          fi

  build:
    name: Build ${{ matrix.asset }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            asset: ScanCarburant-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            asset: ScanCarburant-windows-x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: v${{ inputs.version }}
          releaseBody: ${{ inputs.description }}
          releaseDraft: false
          prerelease: false
          makeLatest: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
